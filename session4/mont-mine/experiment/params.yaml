# @package _global_

# Glacier du Mont Miné (VS), 1700-2024, ELA-based SMB.
# Start from today's geometry in 1700, advance to the Little Ice Age maximum (~1850),
# then retreat. Goal: calibrate the ELA history so that the modelled deglaciation dates
# at the sample sites match the measured (OSL / exposure) ages.

defaults:
  - override /inputs: [oggm_shop, local]
  - override /processes: [smb, iceflow, time, thk]
  - override /outputs: [local, live_dashboard]

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-00907"                  # Glacier du Mont Miné
    thk_source: millan_ice_thickness                # initial ice thickness (Millan et al., 2022)
    filename: input_${inputs.oggm_shop.RGI_ID}.nc
  local:
    filename: ${inputs.oggm_shop.filename}
    coarsening:
      ratio: 2              # GRID: 2 = twice coarser grid -> fast test runs; set 1 for your final runs

processes:
  time:
    start: 1700.0
    end: 2024.0
    save: 5.0
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [ 1700,      0.009,     0.005,  2850,      2.0]
        - [ 1800,      0.009,     0.005,  2900,      2.0]
        - [ 1850,      0.009,     0.005,  2900,      2.0]
        - [ 1900,      0.009,     0.005,  3000,      2.0]
        - [ 2000,      0.009,     0.005,  3100,      2.0]
        - [ 2024,      0.009,     0.005,  3100,      2.0]
  iceflow:                  # ICE FLOW
    physics:                # ICE-FLOW PARAMETERS
      sliding:
        tau_ref: 0.215      # basal shear stress (MPa) to slide at 100 m/yr: lower = more sliding (explore 0.1-0.8)
      viscosity:
        arrhenius: 78.0     # ice softness A (MPa^-3 yr^-1): higher = softer ice (explore 30-150)
    # --- pre-trained ice-flow emulator dahunet_edu: set for you, DO NOT MODIFY ---
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      nbit_init: 0
      retrain_freq: 0
      network:
        pretrained: true
        pretrained_path: dahunet_edu.keras

outputs:
  live_dashboard:
    headless: true          # no screen in the cloud: saves dashboard_*.png images in the run folder

hydra:
  run:
    dir: outputs/${hydra.runtime.choices.experiment}   # RUN FOLDER = name of this file: outputs/<file name>/
