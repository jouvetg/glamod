# Build the course Docker image and push it to the GitHub Container Registry
# (ghcr.io/<owner>/glamod). Make the package public once (GitHub > Packages >
# glamod > Package settings > Change visibility) so that RenkuLab can pull it.
name: Build course image

on:
  push:
    branches: [main]
    paths: ["environment/**", ".github/workflows/build-image.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is ~9 GB (TensorFlow + CUDA libraries): free disk space on the runner first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: environment
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glamod:2026
            ghcr.io/${{ github.repository_owner }}/glamod:${{ github.sha }}
