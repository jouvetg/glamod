# @package _global_

# MORAINES (Session 3, D3): same as params_past.yaml (put YOUR calibrated values below),
# plus Lagrangian PARTICLES (debris) carried by the 3D ice flow. Particles are seeded at the
# surface of the accumulation area, buried, transported, and re-emerge in the ablation area.
# When the glacier retreats after the LIA, the debris left on ice-free terrain shows where
# the modelled LIA moraines are: compare with aerial photos (plot_moraines in the notebook).
# Particle positions are written in outputs/<run>/trajectories/traj-<year>.csv.

defaults:
  - override /inputs: [oggm_shop, local]
  - override /processes: [climate, smb, iceflow, time, thk, particles]
  - override /outputs: [local, live_dashboard]

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-01706"              # <-- YOUR GLACIER (here: Rhone Glacier): the same in all files!
    thk_source: millan_ice_thickness                # initial ice thickness (Millan et al., 2022)
    filename: input_${inputs.oggm_shop.RGI_ID}.nc   # one data file per glacier, re-used if it exists
  local:
    filename: ${inputs.oggm_shop.filename}
    coarsening:
      ratio: 2              # GRID: 2 = twice coarser grid -> fast tests; 1 for the final runs of your report

processes:
  time:
    start: 1700.0
    end: 2020.0
    save: 10.0
  climate:
    method: oggm
    oggm:
      # Used only BEFORE 1901: random years of 1960-1990 shifted by delta_temp (°C).
      # From 1901 to 2019, the observed climate is used (this table is ignored).
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 1700,          -0.5,         1.0]
        - [ 1850,          -1.0,         1.0]
        - [ 1900,           1.0,         1.0]
  smb:
    method: oggm
    oggm:
      melt_enhancer: 1.0    # use YOUR calibrated value (params_past.yaml)
  particles:
    seeding:                # CONTROLS of the debris supply (try them!)
      method: accumulation  # where: surface of the accumulation area (keep it; other strategies need a user module)
      frequency: 2.0        # when: new particles every 2 years (lower = more debris, slower runs)
      density: 0.2          # how many: fraction of the grid cells seeded (higher = more debris)
  iceflow:                  # ICE FLOW
    vertical_velocity:
      enabled: true         # needed to track the particles in 3D
    physics:                # ICE-FLOW PARAMETERS: put YOUR calibrated values (params_sensitivity)
      sliding:
        tau_ref: 0.215      # basal shear stress (MPa) to slide at 100 m/yr: lower = more sliding (explore 0.1-0.8)
      viscosity:
        arrhenius: 78.0     # ice softness A (MPa^-3 yr^-1): higher = softer ice (explore 20-150)
    # --- pre-trained ice-flow emulator dahunet_edu: set for you, DO NOT MODIFY ---
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      nbit_init: 0
      retrain_freq: 0
      network:
        pretrained: true
        pretrained_path: dahunet_edu.keras

outputs:
  live_dashboard:
    headless: true          # no screen in the cloud: saves dashboard_*.png images in the run folder

hydra:
  run:
    dir: outputs/params_past_moraines       # RUN FOLDER (where the results go): keep it equal to the file name
