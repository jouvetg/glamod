# @package _global_

# PAST: 1700-2020, climate-driven SMB.
# Trick: we do not know the glacier geometry in 1700, so we start from TODAY's geometry,
# let the glacier adjust to a cooler pre-industrial climate (LIA advance, maximum ~1850),
# then retreat with the observed climate 1901-2019. Keep the pre-1901 climate below and
# calibrate melt_enhancer so that the glacier (i) reaches the LIA moraines around 1850 and
# (ii) matches the present-day extent/volume in 2020.

defaults:
  - override /inputs: [oggm_shop, local]
  - override /processes: [climate, smb, iceflow, time, thk]
  - override /outputs: [local, live_dashboard]

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-01706"              # <-- YOUR GLACIER (here: Rhone Glacier): the same in all files!
    thk_source: millan_ice_thickness                # initial ice thickness (Millan et al., 2022)
    filename: input_${inputs.oggm_shop.RGI_ID}.nc   # one data file per glacier, re-used if it exists
  local:
    filename: ${inputs.oggm_shop.filename}
    coarsening:
      ratio: 2              # GRID: 2 = twice coarser grid -> fast tests; 1 for the final runs of your report

processes:
  time:
    start: 1700.0
    end: 2020.0
    save: 10.0
  climate:
    method: oggm
    oggm:
      # Used only BEFORE 1901: random years of 1960-1990 shifted by delta_temp (°C).
      # From 1901 to 2019, the observed climate is used (this table is ignored).
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 1700,          -0.5,         1.0]
        - [ 1850,          -1.0,         1.0]
        - [ 1900,           1.0,         1.0]
  smb:
    method: oggm
    oggm:
      melt_enhancer: 1.0    # SMB CALIBRATION: > 1 more melt, < 1 less melt (explore 0.5-2)
  iceflow:                  # ICE FLOW
    physics:                # ICE-FLOW PARAMETERS: put YOUR calibrated values (params_sensitivity)
      sliding:
        tau_ref: 0.215      # basal shear stress (MPa) to slide at 100 m/yr: lower = more sliding (explore 0.1-0.8)
      viscosity:
        arrhenius: 78.0     # ice softness A (MPa^-3 yr^-1): higher = softer ice (explore 20-150)
    # --- pre-trained ice-flow emulator dahunet_edu: set for you, DO NOT MODIFY ---
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      nbit_init: 0
      retrain_freq: 0
      network:
        pretrained: true
        pretrained_path: dahunet_edu.keras

outputs:
  live_dashboard:
    headless: true          # no screen in the cloud: saves dashboard_*.png images in the run folder

hydra:
  run:
    dir: outputs/params_past       # RUN FOLDER (where the results go): keep it equal to the file name
