# @package _global_

# EXPLORATION B2 "ice-flow parameters": 1-year runs (2020-2021) from today's glacier for all
# combinations of ice softness (arrhenius) x basal sliding (tau_ref) listed at the end of this file
# (3 x 4 = 12 runs, ~3 min). Compare the modelled speeds with the observed ones in analysis.ipynb.
# One run per combination: outputs/params_sensitivity/0, 1, ..., 11.

defaults:
  - override /inputs: [oggm_shop, local]
  - override /processes: [climate, smb, iceflow, time, thk]
  - override /outputs: [local, live_dashboard]

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-01706"              # <-- YOUR GLACIER (here: Rhone Glacier): the same in all files!
    thk_source: millan_ice_thickness                # initial ice thickness (Millan et al., 2022)
    filename: input_${inputs.oggm_shop.RGI_ID}.nc   # one data file per glacier, re-used if it exists
  local:
    filename: ${inputs.oggm_shop.filename}
    coarsening:
      ratio: 2              # GRID: 2 = twice coarser grid -> fast tests; 1 for the final runs of your report

processes:
  time:
    start: 2020.0
    end: 2021.0
    save: 1.0
  climate:
    method: oggm
    oggm:
      # After 2019 (end of the climate record), each year is drawn from 1960-1990 and shifted
      # by delta_temp (°C, RELATIVE TO 1960-1990). Use plot_climate(RGI_ID) to get the
      # present-day offset (2020 row), then add the scenario warming (2100 row), see Lecture 2 (Part A, Step 3).
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 2020,           1.3,         1.0]
        - [ 2100,           4.0,         1.0]
  smb:
    method: oggm
    oggm:
      melt_enhancer: 1.0    # use the value calibrated with the past run!
  iceflow:                  # ICE FLOW
    physics:                # ICE-FLOW PARAMETERS: calibrate them on the observed speeds
      sliding:
        tau_ref: 0.215      # basal shear stress (MPa) to slide at 100 m/yr: lower = more sliding (explore 0.1-0.8)
      viscosity:
        arrhenius: 78.0     # ice softness A (MPa^-3 yr^-1): higher = softer ice (explore 30-150)
    # --- pre-trained ice-flow emulator dahunet_edu: set for you, DO NOT MODIFY ---
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      nbit_init: 0
      retrain_freq: 0
      network:
        pretrained: true
        pretrained_path: dahunet_edu.keras

outputs:
  live_dashboard:
    headless: true          # no screen in the cloud: saves dashboard_*.png images in the run folder

hydra:
  mode: MULTIRUN             # several runs, one per value below (or combination of values)
  sweep:
    dir: outputs/${hydra.runtime.choices.experiment}   # RUN FOLDERS: outputs/<file name>/0, 1, 2...
    subdir: ${hydra:job.num}
  sweeper:
    params:
      # all combinations of these values:
      processes.iceflow.physics.viscosity.arrhenius: 50, 78, 150
      processes.iceflow.physics.sliding.tau_ref: 0.1, 0.215, 0.4, 0.8
