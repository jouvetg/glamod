# @package _global_

# EXPLORATION "response time": your glacier under an ELA that oscillates in time
# (user module user/code/processes/smb_oscillating.py, parameters in
# user/conf/processes/smb_oscillating.yaml). Compare the timing of the ELA signal
# with the timing of the volume response: the lag is related to the response time.
# Try other periods (e.g. 50, 100, 400 years): how does the amplitude of the response change?

defaults:
  - /user/conf/processes@processes: smb_oscillating   # parameters of the user module
  - override /inputs: [oggm_shop, local]
  - override /processes: [smb_oscillating, iceflow, time, thk]   # user module instead of smb
  - override /outputs: [local, live_dashboard]

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-01706"              # <-- YOUR GLACIER (here: Rhone Glacier): the same in all files!
    thk_source: millan_ice_thickness                # initial ice thickness (Millan et al., 2022)
    filename: input_${inputs.oggm_shop.RGI_ID}.nc   # one data file per glacier, re-used if it exists
  local:
    filename: ${inputs.oggm_shop.filename}
    coarsening:
      ratio: 2              # GRID: 2 = twice coarser grid -> fast tests; 1 for the final runs of your report

processes:
  smb_oscillating:
    period: 200.0
    amplitude: 200.0
  time:
    start: 0.0
    end: 400.0              # 2 periods (model years, not calendar years)
    save: 5.0
  iceflow:                  # ICE FLOW
    physics:                # ICE-FLOW PARAMETERS: put YOUR calibrated values (params_sensitivity)
      sliding:
        tau_ref: 0.215      # basal shear stress (MPa) to slide at 100 m/yr: lower = more sliding (explore 0.1-0.8)
      viscosity:
        arrhenius: 78.0     # ice softness A (MPa^-3 yr^-1): higher = softer ice (explore 20-150)
    # --- pre-trained ice-flow emulator dahunet_edu: set for you, DO NOT MODIFY ---
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      nbit_init: 0
      retrain_freq: 0
      network:
        pretrained: true
        pretrained_path: dahunet_edu.keras

outputs:
  live_dashboard:
    headless: true          # no screen in the cloud: saves dashboard_*.png images in the run folder

hydra:
  run:
    dir: outputs/params_response_time       # RUN FOLDER (where the results go): keep it equal to the file name
