# @package _global_

# Run B: any glacier from its RGI ID, climate-driven SMB, 2020-2100, warming to +4°C (vs 1960-1990)
# (adapted from igm-examples/quick-demo, IGM 3.2)

defaults:
  - common: iceflow_offline
  - override /inputs:
    - oggm_shop             # download all data for the glacier given its RGI ID
    - local
  - override /processes:
    - climate               # monthly temperature & precipitation
    - smb                   # SMB from the climate
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-02596"   # Great Aletsch Glacier -> replace with yours!
    thk_source: millan_ice_thickness
    filename: input_${inputs.oggm_shop.RGI_ID}.nc   # one data file per glacier (re-used if it exists!)
  local:
    filename: ${inputs.oggm_shop.filename}          # load the file written by oggm_shop
    coarsening:
      ratio: 2              # GRID: 2 = twice coarser grid -> fast test runs; set 1 for your final runs

processes:
  time:
    start: 2020.0
    end: 2100.0
    save: 10.0
  iceflow:                  # ICE FLOW (off-line emulator, see common/iceflow_offline.yaml)
    unified:
      network:
        pretrained_path: "dahunet_edu.keras"   # emulator: dahunet_edu (smallest, fastest)
    physics:
      sliding:
        tau_ref: 0.215         # basal shear stress (MPa) needed to slide at u_ref: lower = more sliding
        u_ref: 100.0          # (m/yr)
      viscosity:
        arrhenius: 78.0       # ice softness A (MPa^-3 a^-1): higher = softer ice
  climate:
    method: oggm            # historical climate (GSWP3-W5E5, 1901-2019) + a trend
    oggm:
      # The trend applies only OUTSIDE the climate record (here after 2019), where years
      # are drawn randomly from 1960-1990 and shifted by delta_temp (relative to 1960-1990).
      # 2000-2019 was ~1.3°C warmer than 1960-1990 (check with plot_climate), hence 2020: +1.3
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 2020,           1.3,         1.0]
        - [ 2100,           4.0,         1.0]
  smb:
    method: oggm            # monthly temperature-index model calibrated by OGGM
    oggm:
      melt_enhancer: 1.0

outputs:
  live_dashboard:
    headless: true
